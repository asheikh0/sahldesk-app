name: Deploy React App to Staging (SmarterASP.net)

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        env:
          VITE_API_BASE_URL: 'https://staging-api.sahldesk.com/api/v1'
        run: npm run build

      - name: FTP Deploy to SmarterASP.NET
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SMARTERASP_STAGING_FTP_SERVER }}
          username: ${{ secrets.SMARTERASP_STAGING_FTP_USER }}
          password: ${{ secrets.SMARTERASP_STAGING_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.SMARTERASP_STAGING_FTP_PATH }}
          timeout: 600000
